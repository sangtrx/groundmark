[build-system]
requires = ["hatchling>=1.25", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "groundmark"
version = "0.4.0"
description = "Production-grade, MarkItDown-powered document intelligence with grounded chunks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GroundMark contributors" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "markitdown[pdf,docx,pptx,xlsx]>=0.1.6,<0.2",
  "openai>=2.0,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymupdf>=1.24",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
accurate = [
  "docling>=2.70",
]
vision = [
  "markitdown-ocr>=0.1.0",
]
distributed = [
  "redis>=5.2",
  "arq>=0.26",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[project.scripts]
groundmark = "groundmark.cli:app"
groundmark-worker = "groundmark.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/groundmark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
