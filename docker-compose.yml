services:
  api:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    image: groundmark:0.4.0
    command:
      - uvicorn
      - groundmark.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      GROUNDMARK_DATA_DIR: /data
      GROUNDMARK_MAX_UPLOAD_MB: "100"
      GROUNDMARK_API_KEY: ${GROUNDMARK_API_KEY:-}
      GROUNDMARK_CORS_ORIGINS: ${GROUNDMARK_CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROUNDMARK_OPENAI_API_KEY: ${GROUNDMARK_OPENAI_API_KEY:-}
    volumes:
      - groundmark-data:/data
    restart: unless-stopped

  worker:
    image: groundmark:0.4.0
    build:
      context: .
      args:
        INSTALL_EXTRAS: ""
    command: ["groundmark-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      GROUNDMARK_DATA_DIR: /data
      GROUNDMARK_MAX_UPLOAD_MB: "100"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROUNDMARK_OPENAI_API_KEY: ${GROUNDMARK_OPENAI_API_KEY:-}
    volumes:
      - groundmark-data:/data
    restart: unless-stopped

volumes:
  groundmark-data:
